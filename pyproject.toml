[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semanticlens"
version = "0.1.0"
description = "A knowledge graph connecting IPCC AR6 figures to scientific terms identified in their captions."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "rdflib>=7,<8",
    "requests",
    "beautifulsoup4",
]

[project.optional-dependencies]
pipeline = [
    "pydantic>=2,<3",
    "pyshacl",
]

[project.urls]
Homepage = "https://github.com/semanticClimate/semanticlens"
Repository = "https://github.com/semanticClimate/semanticlens"
Issues = "https://github.com/semanticClimate/semanticlens/issues"

[tool.setuptools]
packages = [
    "ipcc_kg",
    "concepts",
    "ontology",
]
