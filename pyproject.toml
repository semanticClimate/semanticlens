[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semanticlens-vision"
version = "0.1.0a1"
description = "An extensible toolkit for visual document retrieval and evidence-grounded document AI"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]

keywords = [
    "visual-document-retrieval",
    "multimodal-retrieval",
    "document-ai",
    "document-search",
    "late-interaction",
    "climate-science",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0,<3",
    "pypdfium2>=4.30,<6",
    "Pillow>=10,<13",
    "sentence-transformers[image]>=6.0,<7",
    "qdrant-client>=1.12,<2",
]

[project.optional-dependencies]

# Optional structured PDF parsing.
# Not required for the main SemanticLens pipeline.
mineru = [
    "mineru==4.0.10",
    "docvortex==0.5.7",
    "pydantic>=2.12.5,<3",
]

# Development and package publishing tools.
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.11",
    "twine>=6.0",
]

[project.urls]
Homepage = "https://github.com/semanticClimate/semanticlens"
Repository = "https://github.com/semanticClimate/semanticlens"
Issues = "https://github.com/semanticClimate/semanticlens/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["semanticlens*"]
namespaces = false

[tool.ruff]
target-version = "py311"
line-length = 100
